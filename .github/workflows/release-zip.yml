name: Build unsigned macOS archive

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      CONDUCTOR_OUTPUT_DIR: dist
      CONDUCTOR_BUNDLE_ID: ai.conductor.public
      CONDUCTOR_ARCH: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check toolchain
        run: |
          test "$(uname -m)" = arm64
          xcrun swift --version
      - name: Build unsigned app
        run: bash build.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/Conductor.app' 'dist/Conductor-macos-arm64.zip'
      - name: Upload archive to the workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conductor-${{ github.ref_name }}-macos-arm64
          path: dist/Conductor-macos-arm64.zip
          if-no-files-found: error
