name: Build unsigned macOS archive

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      CONDUCTOR_OUTPUT_DIR: dist
      CONDUCTOR_BUNDLE_ID: ai.conductor.public
      CONDUCTOR_ARCH: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check toolchain
        run: |
          test "$(uname -m)" = arm64
          xcrun swift --version
      - name: Build unsigned app
        run: bash build.sh
      - name: Verify bundled artwork and localizations
        run: |
          resources='dist/Conductor.app/Contents/Resources'
          test -s "$resources/AppIcon.icns"
          for language in en ru; do
            test -s "$resources/$language.lproj/Localizable.strings"
            test -s "$resources/$language.lproj/InfoPlist.strings"
          done
          for state in ready listening recognizing thinking acting checking attention; do
            test -s "$resources/ConductorStates/$state.png"
            test -s "$resources/ConductorStates/$state.mp4"
          done
      - name: Test command handling and action catalogue
        run: "'dist/Conductor.app/Contents/MacOS/Conductor' --self-test"
      - name: Test API handling with local HTTP fixtures
        run: "'dist/Conductor.app/Contents/MacOS/Conductor' --activity-test"
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'dist/Conductor.app' 'dist/Conductor-macos-arm64.zip'
          unzip -t 'dist/Conductor-macos-arm64.zip'
      - name: Upload archive to the workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conductor-${{ github.ref_name }}-macos-arm64
          path: dist/Conductor-macos-arm64.zip
          if-no-files-found: error
          archive: false
